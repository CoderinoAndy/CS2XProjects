<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 1</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="HTML + CSS/favicons/favicon.png">
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">

        <label for="username">Username:</label>
        <input minlength="6" maxlength="15" placeholder="Spongebob" type="text" id="username"> <br>

        <label for="password">Password:</lable required>
        <input type="password" id="password"> <br>

        <label for="email">Email:</lable required>
        <input type="email" id="email" placeholder="meowmeow@gmail.com"> <br>

        <label for="phone">Phone #:</lable required>
        <input type="tel" id="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}>" placeholder="123-456-7890"><br>

        <label for="bday">Birthday:</label>
        <input type="date" id="bday"><br>

        <label for="quantity">Quantity of product:</label>
        <input type="number" id="quantity" min="0" max="99"><br>

        <label for="title">Title:</label>

        <label for="Dr.">Dr.</label>
        <input type="radio" id="Dr." value="Dr." name="title">

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title">

        <label for="Mrs.">Mrs.</label>
        <input type="radio" id="Mrs." value="Mrs." name="title">

        <label for="Ms.">Ms.</label>
        <input type="radio" id="Ms." value="Ms." name="title">
        <br>

        <label for="payment">Payment:</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="mastercard">mastercard</option>
            <option value="giftcard">giftcard</option>
        </select><br>

        <label for="subscribe">subscribe</label>
        <input type="checkbox" id="subscribe"><br>

        <label for="comment">Comment:</label>
        <textarea id="comment" rows="3" cols="30"></textarea>

        <label for="file">file:</label>
        <input type="file" id="file" accept="image/png, image/jpeg"><br>

        <input type="reset"><br>
        <input type="submit" required>
    </form>
</body>
