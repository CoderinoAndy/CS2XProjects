<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Grid practice</title>
    </head>
    <body>
        <div style="display: grid; grid-template-columns: 100px 100px;">
            <div style="background-color: lightblue;">div 1<p>hello</p></div>
            <div style="background-color: lightpink;">div 2</div>
        </div>
        <div style="display: grid; grid-template-columns: 100px 100px; margin-top: 20px;">
            <div style="background-color: lightblue;">div 1<p>hello</p></div>
            <div style="background-color: lightpink;">div 2</div>
        </div>
    </body>
</html>
