<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicons/favicon.png">
</head>
<body>
    <p>This is <b>bold text</b></p>
    <p>This is <i>italicized text</i></p>
    <p>This is <u>underlined text</u></p>
    <p>This is <del>deleted text</del></p>
    <p>This is <big>big text</big></p>
    <p>This is <small>small text</small></p>
    <p>This is <sub>subscript text</sub></p>
    <p>This is <sup>superscript text</sup></p>
    <p>This is <tt>monospaced text</tt></p>
    <p>This is <mark style="background-color: lightblue">highlighted text</mark></p>

    

</body>
</html>
