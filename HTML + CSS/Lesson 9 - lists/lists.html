<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="HTML + CSS/favicons/favicon.png">
</head>
<body>
  <h4>Unordered lists</h4>
  <ul>
    <li>item 1</li>
    <li>item 2</li>
    <li>item 3</li>
    <ul>
      <li>subitem 1</li>
      <li>subitem 2</li>
    </ul>
  </ul>
  <h4>Ordered lists</h4>
  <ol>
    <li>eat breakfast</li>
    <li>Go to class</li>
    <li>walk dog</li>
  </ol>

  <h4>Description list</h4>
  <dl>
    <dt>dragon</dt>
    <dd>Random dragon fact here</dd>
    <dt>pheonix</dt>
    <dd>Random pheonix fact here</dd>
    <dt>vampire</dt>
    <dd>Random vampire fact here</dd>
    <dt>werewolf</dt>
    <dd>Random werewolf fact here</dd>
  </dl>
</body>
